[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["vendor"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=vendor/openzeppelin/contracts/", "forge-std/=vendor/forge-std/src/"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
